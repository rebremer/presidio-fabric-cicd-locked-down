# Azure DevOps pipeline: deploy the Presidio Fabric environment + smoke-test
# notebook into a WSPL/DEP-protected Fabric workspace using fabric-cicd.
#
# Runs on a self-hosted Ubuntu agent (see scripts/setup-agent.sh) registered
# in pool 'Default'. The agent must:
#   - have outbound internet to pypi.org and dev.azure.com
#   - have private DNS resolution for the workspace's WSPL FQDN
#     (VNet linked to the privatelink.fabric.microsoft.com zone)
#
# Pipeline variables (set in ADO -> Pipelines -> Edit -> Variables):
#   AZURE_SERVICE_CONNECTION = <UAMI/WIF service connection name>
#   FABRIC_WORKSPACE_ID      = <workspace GUID>
#   FABRIC_BASE_API_URL      = https://<wsid-no-dashes>.zfc.w.api.fabric.microsoft.com
#   FABRIC_ENVIRONMENT       = PPE
#
# Strategy:
#   1. pip download (--platform manylinux* --python-version 3.11 --abi cp311
#      --only-binary=:all:) the full transitive closure for Linux/cp311.
#   2. fabric-cicd uploads the wheels into the env's CustomLibraries/ folder.
#   3. deploy.py monkey-patches fabric-cicd to DELETE environment.yml from
#      staging before publish: WSPL blocks pypi.org / conda-forge, so the
#      Fabric publish backend must skip the public-deps resolve step.
#      (Workspace storage where wheels live IS reachable via WSPL.)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - workspace/**
      - deploy.py
      - requirements-deploy.txt
      - requirements-presidio.txt
      - azure-pipelines.yml

pr: none

pool:
  name: Default
  demands:
    - Agent.OS -equals Linux

variables:
  - name: customLibsDir
    value: workspace/16_presidio/PresidioPriv.Environment/Libraries/CustomLibraries

stages:
  - stage: Deploy
    displayName: Publish to Fabric
    jobs:
      - job: publish
        displayName: fabric-cicd publish (Linux)
        timeoutInMinutes: 60
        steps:
          - checkout: self
            displayName: Checkout sources

          - bash: |
              set -euo pipefail
              echo "Agent OS:    $(uname -a)"
              echo "Python:      $(python3 --version)"
              echo "Az CLI:      $(az --version | head -n 1)"
            displayName: Show toolchain versions

          - bash: |
              set -euo pipefail
              python3 -m pip install --user --upgrade pip
              python3 -m pip install --user -r requirements-deploy.txt
            displayName: Install fabric-cicd

          - bash: |
              set -euo pipefail
              echo "==> Pre-clean ${CUSTOM_LIBS_DIR}"
              mkdir -p "${CUSTOM_LIBS_DIR}"
              find "${CUSTOM_LIBS_DIR}" -type f \( -name '*.whl' -o -name '*.tar.gz' \) -delete

              echo "==> pip download Linux py3.11 wheels into ${CUSTOM_LIBS_DIR}"
              # Resolve full transitive closure for Linux/cp311. fabric-cicd
              # uploads everything in CustomLibraries/ to workspace storage,
              # which IS reachable via WSPL. Duplicates of packages already in
              # the Fabric runtime are harmless (runtime wins at import time).
              python3 -m pip download \
                  --dest "${CUSTOM_LIBS_DIR}" \
                  --python-version 3.11 \
                  --platform manylinux2014_x86_64 \
                  --platform manylinux_2_17_x86_64 \
                  --platform manylinux_2_28_x86_64 \
                  --implementation cp \
                  --abi cp311 \
                  --only-binary=:all: \
                  -r requirements-presidio.txt

              echo "==> Vendored wheels:"
              ls -la "${CUSTOM_LIBS_DIR}"
              echo "Total: $(ls "${CUSTOM_LIBS_DIR}" | wc -l) files"
            env:
              CUSTOM_LIBS_DIR: $(customLibsDir)
            displayName: Vendor Presidio wheels (Linux py3.11 manylinux)

          - task: AzureCLI@2
            displayName: Run fabric-cicd deploy
            env:
              FABRIC_WORKSPACE_ID: $(FABRIC_WORKSPACE_ID)
              FABRIC_ENVIRONMENT: $(FABRIC_ENVIRONMENT)
              FABRIC_BASE_API_URL: $(FABRIC_BASE_API_URL)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                export AZURE_TENANT_ID="$tenantId"
                export AZURE_CLIENT_ID="$servicePrincipalId"
                # WIF: no client secret. AzureCLI@2 leaves an authenticated
                # az session; DefaultAzureCredential -> AzureCliCredential
                # will reuse it for fabric-cicd.
                python3 deploy.py

          - task: AzureCLI@2
            displayName: Run smoke-test notebook
            env:
              FABRIC_WORKSPACE_ID: $(FABRIC_WORKSPACE_ID)
              FABRIC_BASE_API_URL: $(FABRIC_BASE_API_URL)
              SMOKE_NOTEBOOK_NAME: PresidioSmokeTest
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                TOKEN=$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)
                BASE="${FABRIC_BASE_API_URL}/v1/workspaces/${FABRIC_WORKSPACE_ID}"

                echo "==> Resolving notebook id for '${SMOKE_NOTEBOOK_NAME}'"
                NB_ID=$(curl -sS -H "Authorization: Bearer $TOKEN" "${BASE}/notebooks" \
                    | python3 -c "import json,sys,os; n=os.environ['SMOKE_NOTEBOOK_NAME']; \
                                  print(next(i['id'] for i in json.load(sys.stdin)['value'] if i['displayName']==n))")
                echo "    notebook id: ${NB_ID}"

                echo "==> Triggering notebook run"
                LOC=$(curl -sS -D - -o /dev/null -X POST \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Length: 0" \
                    "${BASE}/items/${NB_ID}/jobs/instances?jobType=RunNotebook" \
                    | tr -d '\r' | awk -F': ' '/^[Ll]ocation:/ {print $2}')
                echo "    job location: ${LOC}"

                echo "==> Polling job status"
                for i in $(seq 1 60); do
                    sleep 20
                    STATUS=$(curl -sS -H "Authorization: Bearer $TOKEN" "${LOC}" \
                        | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))")
                    echo "    [${i}] status=${STATUS}"
                    case "$STATUS" in
                        Completed) echo "Notebook run succeeded."; exit 0 ;;
                        Failed|Cancelled|Deduped)
                            echo "Notebook run ended with status: $STATUS"
                            curl -sS -H "Authorization: Bearer $TOKEN" "${LOC}" | python3 -m json.tool
                            exit 1 ;;
                    esac
                done
                echo "Timeout waiting for notebook run."
                exit 1
