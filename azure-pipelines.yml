# Azure DevOps pipeline: deploy the Presidio Fabric environment + smoke-test
# notebook into the target workspace using fabric-cicd.
#
# Prereqs (one-time, in the ADO project):
#   1. Create an ARM service connection (workload identity / SPN) with
#      access to the Fabric workspace. Save its name.
#   2. Add pipeline variables:
#        AZURE_SERVICE_CONNECTION = <service-connection-name>
#        FABRIC_WORKSPACE_ID      = <workspace GUID>      (e.g. testpub)
#        FABRIC_ENVIRONMENT       = PPE                   (or PROD)
#   3. Make sure the self-hosted agent pool 'test-privenv-fabric' has
#      line-of-sight to the (DEP-protected) Fabric workspace.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - workspace/**
      - deploy.py
      - requirements-deploy.txt
      - azure-pipelines.yml

pr: none

# Runtime parameter to skip the wheel vendoring step. Use this to publish an
# empty (conda-only) Environment for diagnostics: it confirms whether the DEP
# workspace can publish at all, isolating network/identity issues from
# package-content issues.
parameters:
  - name: vendorWheels
    displayName: Vendor Presidio wheels into CustomLibraries/
    type: boolean
    default: true

pool:
  name: Default

variables:
  - name: pythonVersion
    value: "3.11"

stages:
  - stage: Deploy
    displayName: Publish to Fabric
    jobs:
      - job: publish
        displayName: fabric-cicd publish
        timeoutInMinutes: 60
        steps:
          - checkout: self
            displayName: Checkout sources

          - script: |
              python --version
              python -m pip --version
            displayName: Show pre-installed Python

          - script: |
              python -m pip install --upgrade pip
              python -m pip install -r requirements-deploy.txt
            displayName: Install fabric-cicd

          # Pre-download Presidio wheels from pypi.org on the agent (which
          # has internet) into the Environment's CustomLibraries/ folder.
          # fabric-cicd then uploads them to the DEP workspace where
          # pypi.org is unreachable during environment publish.
          # Skip via the `vendorWheels` runtime parameter to publish an
          # empty environment for diagnostics.
          - ${{ if eq(parameters.vendorWheels, true) }}:
            - powershell: |
                $ErrorActionPreference = 'Stop'
                $dest = 'workspace/16_presidio/Presidio.Environment/Libraries/CustomLibraries'
                New-Item -ItemType Directory -Force -Path $dest | Out-Null
                Get-ChildItem -Path $dest -Include *.whl,*.tar.gz -File -Recurse | Remove-Item -Force
                python -m pip download -r requirements-presidio.txt `
                  --dest $dest `
                  --only-binary=:all: `
                  --python-version 3.11 `
                  --platform manylinux2014_x86_64 `
                  --implementation cp `
                  --abi cp311
                if ($LASTEXITCODE -ne 0) { throw "pip download failed" }
                Write-Host "Vendored wheels:"
                Get-ChildItem $dest | Format-Table Name, Length
              displayName: Vendor Presidio wheels

          - ${{ if eq(parameters.vendorWheels, false) }}:
            - powershell: |
                $dest = 'workspace/16_presidio/Presidio.Environment/Libraries/CustomLibraries'
                Get-ChildItem -Path $dest -Include *.whl,*.tar.gz -File -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
                Write-Host "Skipped wheel vendoring -- publishing empty environment for diagnostics."
              displayName: Skip vendoring (diagnostic empty publish)

          # Authenticate to Azure using the service connection, then export
          # the resulting access token as AZURE_* env vars so that
          # DefaultAzureCredential picks them up inside deploy.py.
          - task: AzureCLI@2
            displayName: Run fabric-cicd deploy
            env:
              FABRIC_WORKSPACE_ID: $(FABRIC_WORKSPACE_ID)
              FABRIC_ENVIRONMENT: $(FABRIC_ENVIRONMENT)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: ps
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                $env:AZURE_TENANT_ID   = $env:tenantId
                $env:AZURE_CLIENT_ID   = $env:servicePrincipalId
                $env:AZURE_CLIENT_SECRET = $env:servicePrincipalKey
                python deploy.py
