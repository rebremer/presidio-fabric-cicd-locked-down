# Azure DevOps pipeline: deploy the Presidio Fabric environment + smoke-test
# notebook into a DEP-protected workspace using fabric-cicd.
#
# Runs on a self-hosted Ubuntu agent (see scripts/setup-agent.sh) registered
# in pool 'Default'. The agent must:
#   - have outbound internet to pypi.org, repo.anaconda.com, github.com
#   - have private DNS resolution for the workspace's WSPL FQDN
#     (vnet linked to privatelink.fabric.microsoft.com zone)
#
# Pipeline variables (set in ADO -> Pipelines -> Edit -> Variables):
#   AZURE_SERVICE_CONNECTION = <UAMI/WIF service connection name>
#   FABRIC_WORKSPACE_ID      = <workspace GUID>
#   FABRIC_BASE_API_URL      = https://<wsid-no-dashes>.zfc.w.api.fabric.microsoft.com
#   FABRIC_ENVIRONMENT       = PPE
#
# Wheel-vendoring strategy follows
# https://learn.microsoft.com/fabric/data-engineering/environment-manage-library-with-outbound-access-protection
#   1. Download Fabric-Python311-CPU.yml from microsoft/synapse-spark-runtime
#   2. Strip Microsoft-private packages (notebookutils, semantic-link-sempy,
#      synapseml, etc.) so conda can resolve from public channels
#   3. conda env create -> activates a replica of the Fabric runtime image
#   4. pip download -r requirements-presidio.txt -d CustomLibraries/
#      resolves only the deltas Fabric needs

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - workspace/**
      - deploy.py
      - requirements-deploy.txt
      - requirements-presidio.txt
      - azure-pipelines.yml

pr: none

parameters:
  - name: vendorWheels
    displayName: Vendor Presidio wheels into CustomLibraries/
    type: boolean
    default: true
  - name: fabricRuntimeYml
    displayName: Fabric runtime YML to mirror locally
    type: string
    default: Fabric-Python311-CPU.yml
  - name: fabricRuntimeDir
    displayName: Subfolder under microsoft/synapse-spark-runtime/Fabric/
    type: string
    default: Runtime 1.3 (Spark 3.5)

pool:
  name: Default
  demands:
    - Agent.OS -equals Linux

variables:
  - name: pythonVersion
    value: "3.11"
  - name: customLibsDir
    value: workspace/16_presidio/PresidioPriv.Environment/Libraries/CustomLibraries
  - name: condaEnvName
    value: fabric-env

stages:
  - stage: Deploy
    displayName: Publish to Fabric
    jobs:
      - job: publish
        displayName: fabric-cicd publish (Linux)
        timeoutInMinutes: 60
        steps:
          - checkout: self
            displayName: Checkout sources

          - bash: |
              set -euo pipefail
              echo "Agent OS:    $(uname -a)"
              echo "Python:      $(python3 --version)"
              echo "Conda:       $(~/miniconda3/bin/conda --version)"
              echo "Az CLI:      $(az --version | head -n 1)"
            displayName: Show toolchain versions

          - bash: |
              set -euo pipefail
              python3 -m pip install --user --upgrade pip
              python3 -m pip install --user -r requirements-deploy.txt
            displayName: Install fabric-cicd

          - ${{ if eq(parameters.vendorWheels, true) }}:
            - bash: |
                set -euo pipefail
                export PATH="$HOME/miniconda3/bin:$PATH"
                source "$HOME/miniconda3/etc/profile.d/conda.sh"

                RUNTIME_YML='${{ parameters.fabricRuntimeYml }}'
                RUNTIME_DIR='${{ parameters.fabricRuntimeDir }}'
                # URL-encode spaces and parentheses in the directory name
                RUNTIME_DIR_ENC=$(printf '%s' "$RUNTIME_DIR" | sed 's/ /%20/g; s/(/%28/g; s/)/%29/g')
                RUNTIME_URL="https://raw.githubusercontent.com/microsoft/synapse-spark-runtime/main/Fabric/${RUNTIME_DIR_ENC}/${RUNTIME_YML}"

                echo "==> Fetching Fabric runtime YML: ${RUNTIME_URL}"
                curl -fsSL "$RUNTIME_URL" -o "/tmp/${RUNTIME_YML}"

                # Strip Microsoft-private libraries (per docs). Keep this list
                # in sync with the table at:
                # https://learn.microsoft.com/fabric/data-engineering/environment-manage-library-with-outbound-access-protection#step-2-remove-private-libraries-from-the-yml-file
                PRIVATE_PKGS=(
                  "azure-synapse-ml-predict"
                  "azureml-synapse"
                  "chat-magics"
                  "chat-magics-fabric"
                  "control-script"
                  "ds-copilot"
                  "dscopilot-installer"
                  "fabric-analytics-notebook-plugin"
                  "fabric-analytics-sdk"
                  "fabric-connection"
                  "flaml"
                  "flt-python"
                  "fsspec_wrapper"
                  "geoanalytics-fabric"
                  "impulse-python-handler"
                  "kqlmagiccustom"
                  "library-metadata-cooker"
                  "notebookutils"
                  "prose-pandas2pyspark"
                  "prose-suggestions"
                  "semantic-link-sempy"
                  "spark-mssql-connector-fabric35"
                  "spark-mssql-connector-fabric40"
                  "sqlanalyticsconnectorpy"
                  "sqlanalyticsfabricconnectorpy"
                  "synapseml"
                  "synapseml-cognitive"
                  "synapseml-core"
                  "synapseml-deep-learning"
                  "synapseml-internal"
                  "synapseml-lightgbm"
                  "synapseml-opencv"
                  "synapseml-vw"
                )
                cp "/tmp/${RUNTIME_YML}" "/tmp/${RUNTIME_YML}.orig"
                for pkg in "${PRIVATE_PKGS[@]}"; do
                  sed -i "/[[:space:]-][[:space:]]*${pkg}\([=<>!~ ]\|$\)/d" "/tmp/${RUNTIME_YML}"
                done
                echo "==> Stripped $(diff /tmp/${RUNTIME_YML}.orig /tmp/${RUNTIME_YML} | grep -c '^<') private packages"

                echo "==> Creating conda env '${CONDA_ENV_NAME}' from runtime YML"
                conda env remove -n "${CONDA_ENV_NAME}" -y >/dev/null 2>&1 || true
                conda env create -n "${CONDA_ENV_NAME}" -f "/tmp/${RUNTIME_YML}"
                conda activate "${CONDA_ENV_NAME}"

                echo "==> Pre-clean ${CUSTOM_LIBS_DIR}"
                mkdir -p "${CUSTOM_LIBS_DIR}"
                find "${CUSTOM_LIBS_DIR}" -type f \( -name '*.whl' -o -name '*.tar.gz' \) -delete

                echo "==> pip download deltas into ${CUSTOM_LIBS_DIR}"
                pip download -r requirements-presidio.txt -d "${CUSTOM_LIBS_DIR}"

                echo "==> Vendored wheels:"
                ls -la "${CUSTOM_LIBS_DIR}"
                echo "Total: $(ls "${CUSTOM_LIBS_DIR}" | wc -l) files"
              env:
                CONDA_ENV_NAME: $(condaEnvName)
                CUSTOM_LIBS_DIR: $(customLibsDir)
              displayName: Vendor Presidio wheels (Fabric runtime mirror)

          - ${{ if eq(parameters.vendorWheels, false) }}:
            - bash: |
                set -euo pipefail
                mkdir -p "${CUSTOM_LIBS_DIR}"
                find "${CUSTOM_LIBS_DIR}" -type f \( -name '*.whl' -o -name '*.tar.gz' \) -delete
                echo "Skipped wheel vendoring -- publishing empty environment for diagnostics."
              env:
                CUSTOM_LIBS_DIR: $(customLibsDir)
              displayName: Skip vendoring (diagnostic empty publish)

          - task: AzureCLI@2
            displayName: Run fabric-cicd deploy
            env:
              FABRIC_WORKSPACE_ID: $(FABRIC_WORKSPACE_ID)
              FABRIC_ENVIRONMENT: $(FABRIC_ENVIRONMENT)
              FABRIC_BASE_API_URL: $(FABRIC_BASE_API_URL)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                export AZURE_TENANT_ID="$tenantId"
                export AZURE_CLIENT_ID="$servicePrincipalId"
                # WIF: no client secret. AzureCLI@2 leaves an authenticated
                # az session; DefaultAzureCredential -> AzureCliCredential
                # will reuse it for fabric-cicd.
                python3 deploy.py
